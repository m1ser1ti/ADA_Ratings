<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <script src="/js/theme-init.js"></script>
  <title>Moderation · ProfScope</title>
  <meta name="description" content="Moderation queue.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/css/shell.css">
  <link rel="stylesheet" href="/css/admin.css">
  <script type="module" src="/js/common.js"></script>
  <script type="module" src="/js/admin.js"></script>
</head>
<body class="mod-page">
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="mod-bar">
    <div class="mod-wrap mod-bar-row">
      <a href="/" class="mod-home" aria-label="ProfScope home">
        <svg class="brand-mark" viewBox="205 120 790 775" aria-hidden="true" focusable="false">
          <g class="brand-bars"><path d="M455 315 L535 270 L535 430 L455 486 Z"/><path d="M560 250 L640 205 L640 440 L560 485 Z"/><path d="M665 185 L745 140 L745 425 L665 470 Z"/></g>
          <g class="brand-book"><path d="M590 570 C520 500 420 455 300 435 L270 635 C385 642 500 684 590 750 Z"/><path d="M610 570 C680 500 780 455 900 435 L930 635 C815 642 700 684 610 750 Z"/><path d="M285 655 C405 657 505 700 600 770 C695 700 795 657 915 655 L945 690 C815 696 700 744 600 815 C500 744 385 696 255 690 Z"/><path d="M245 700 C380 706 500 755 600 830 C700 755 820 706 955 700 L975 735 C825 745 700 800 600 875 C500 800 375 745 225 735 Z"/></g>
          <g class="brand-fold"><path d="M300 435 C420 455 520 500 590 570 L600 815 C500 744 385 696 255 690 L270 635 C385 642 500 684 590 750 L590 570"/><path d="M900 435 C780 455 680 500 610 570 L600 815 C700 744 815 696 945 690 L930 635 C815 642 700 684 610 750 L610 570"/><path d="M600 570 L600 815"/></g>
        </svg>
      </a>
      <div class="mod-bar-title">
        <h1>Moderation</h1>
        <p class="mod-updated" id="mod-updated" hidden></p>
      </div>
      <div class="mod-bar-actions">
        <button type="button" class="mod-icon-btn" id="mod-refresh" aria-label="Refresh" title="Refresh" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
        </button>
        <button type="button" class="theme-switch" role="switch" aria-checked="false" aria-label="Dark theme" title="Switch light / dark theme">
          <span class="theme-switch-track"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><span class="theme-switch-knob"></span></span>
        </button>
        <button type="button" class="mod-logout" id="mod-logout" hidden>Log out</button>
      </div>
    </div>
    <div class="mod-wrap mod-tabs-row" id="mod-tabs-row" hidden>
      <div class="mod-tabs" role="tablist" aria-label="Moderation queues">
        <button type="button" class="mod-tab" role="tab" id="tab-approve" aria-controls="panel-approve" aria-selected="true" data-tab="approve">
          <span class="mod-tab-count" data-count="approve">0</span><span class="mod-tab-label">To approve</span>
        </button>
        <button type="button" class="mod-tab" role="tab" id="tab-reported" aria-controls="panel-reported" aria-selected="false" tabindex="-1" data-tab="reported">
          <span class="mod-tab-count" data-count="reported">0</span><span class="mod-tab-label">Reported</span>
        </button>
        <button type="button" class="mod-tab" role="tab" id="tab-faculty" aria-controls="panel-faculty" aria-selected="false" tabindex="-1" data-tab="faculty">
          <span class="mod-tab-count" data-count="faculty">0</span><span class="mod-tab-label">Faculty<span class="mod-tab-long"> requests</span></span>
        </button>
        <button type="button" class="mod-tab" role="tab" id="tab-blocked" aria-controls="panel-blocked" aria-selected="false" tabindex="-1" data-tab="blocked">
          <span class="mod-tab-count" data-count="blocked">0</span><span class="mod-tab-label">Blocked</span>
        </button>
      </div>
    </div>
  </header>

  <main id="main" tabindex="-1">
    <div class="mod-wrap">
      <form class="mod-login" id="admin-login" hidden>
        <h2 class="mod-login-title">Sign in to moderate</h2>
        <label class="label" for="admin-token">Moderator token</label>
        <input class="input" id="admin-token" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false" required>
        <p class="field-error" id="admin-error" role="alert"></p>
        <button type="submit" class="btn btn-primary btn-block">Open queue</button>
      </form>

      <div id="admin-queue" hidden>
        <div class="mod-error" id="mod-error" role="alert" hidden>
          <p id="mod-error-text"></p>
          <button type="button" class="btn btn-ghost btn-sm" id="mod-retry">Try again</button>
        </div>

        <section class="mod-panel" role="tabpanel" id="panel-approve" aria-labelledby="tab-approve">
          <div id="mod-bursts" role="note" hidden></div>
          <ul class="mod-list" id="list-awaiting" aria-label="Reviews waiting for approval, oldest first"></ul>
          <details class="mod-recent" id="mod-recent">
            <summary>Recently published</summary>
            <ul class="mod-list" id="list-recent" aria-label="Recently published reviews"></ul>
          </details>
        </section>

        <section class="mod-panel" role="tabpanel" id="panel-reported" aria-labelledby="tab-reported" hidden>
          <h2 class="mod-group" id="group-live" hidden>Reported, still on the site</h2>
          <ul class="mod-list" id="list-live" aria-labelledby="group-live"></ul>
          <h2 class="mod-group" id="group-hidden" hidden>Hidden</h2>
          <ul class="mod-list" id="list-hidden" aria-labelledby="group-hidden"></ul>
        </section>

        <section class="mod-panel" role="tabpanel" id="panel-faculty" aria-labelledby="tab-faculty" hidden>
          <ul class="mod-list" id="list-requests" aria-label="Profile removal requests"></ul>
          <h2 class="mod-group" id="group-removed" hidden>Removed profiles</h2>
          <ul class="mod-list" id="list-removed" aria-labelledby="group-removed"></ul>
        </section>

        <section class="mod-panel" role="tabpanel" id="panel-blocked" aria-labelledby="tab-blocked" hidden>
          <ul class="mod-list" id="list-bans" aria-label="Active blocks"></ul>
        </section>
      </div>
      <p id="admin-status" class="visually-hidden" role="status"></p>
    </div>
  </main>

  <div class="mod-toast" id="mod-toast" hidden>
    <p class="mod-toast-text" id="mod-toast-text" role="status"></p>
    <button type="button" class="mod-toast-undo" id="mod-toast-undo" hidden>Undo</button>
  </div>

  <dialog class="mod-dialog" id="mod-confirm" aria-labelledby="mod-confirm-title" aria-describedby="mod-confirm-text">
    <form method="dialog">
      <h2 id="mod-confirm-title"></h2>
      <p id="mod-confirm-text"></p>
      <div class="mod-dialog-actions">
        <button type="submit" value="cancel" class="btn btn-ghost" id="mod-confirm-cancel">Cancel</button>
        <button type="submit" value="ok" class="btn mod-btn-danger" id="mod-confirm-ok"></button>
      </div>
    </form>
  </dialog>
</body>
</html>
