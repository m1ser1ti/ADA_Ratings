<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>School · ADA Ratings</title>
  <link rel="icon" href="/ada_logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,500;0,8..60,600;1,8..60,500&display=swap">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="js/common.js"></script>
  <script type="module" src="js/school.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="container site-header-inner">
      <a href="/" class="brand">
        <img src="/ada_logo.svg" alt="" class="brand-logo">
        <span class="brand-name">ADA <b>Ratings</b></span>
      </a>
      <div class="search" role="search">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <label for="header-search" class="visually-hidden">Search professors</label>
        <input id="header-search" class="search-input" type="search" placeholder="Search professors…"
          autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="header-search-results">
        <ul id="header-search-results" class="search-results" role="listbox" aria-label="Professors" hidden></ul>
        <p class="search-live visually-hidden" aria-live="polite"></p>
      </div>
      <nav class="header-nav" aria-label="Main">
        <a class="header-link" href="https://adagpacalculator.up.railway.app/" target="_blank" rel="noopener">GPA Calculator<span class="visually-hidden"> (opens in a new tab)</span></a>
      </nav>
    </div>
  </header>

  <main id="main">
    <section class="page-hero" aria-labelledby="school-code">
      <img id="hero-img" class="page-hero-img" src="/ada_campus2.jpg" alt="">
      <div class="container">
        <nav class="breadcrumbs" aria-label="Breadcrumb">
          <ol>
            <li><a href="/">All schools</a></li>
            <li><span id="crumb-school" aria-current="page">School</span></li>
          </ol>
        </nav>
        <h1 id="school-code">School</h1>
        <p id="school-name"></p>
      </div>
    </section>

    <div class="container">
      <figure class="dean" id="dean" hidden></figure>

      <section class="section" aria-labelledby="faculty-title">
        <div class="section-head">
          <h2 id="faculty-title">Faculty</h2>
        </div>
        <div class="toolbar">
          <label for="prof-filter" class="visually-hidden">Filter professors by name or subject</label>
          <input id="prof-filter" class="input" type="search" placeholder="Filter by name or subject…" autocomplete="off">
          <label class="field-inline">Sort by
            <select id="prof-sort" class="select">
              <option value="rating">Highest rated</option>
              <option value="reviews">Most reviewed</option>
              <option value="name">Name (A–Z)</option>
            </select>
          </label>
          <p class="result-count" id="result-count" aria-live="polite"></p>
        </div>
        <ul id="prof-grid" class="prof-grid"></ul>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© <span data-year></span> ADA Ratings · An unofficial student project, not affiliated with ADA University.</p>
      <p>Reviews reflect students’ personal opinions.</p>
    </div>
  </footer>
</body>
</html>
